name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /srv/personal-site
            git pull origin main
            docker build -t personal-site:latest .
            docker stop personal-site 2>/dev/null; docker rm personal-site 2>/dev/null
            docker run -d --name personal-site --restart unless-stopped \
              -e VIRTUAL_HOST=mkt77.site \
              -e VIRTUAL_PORT=3000 \
              --network web \
              personal-site:latest
            docker image prune -f
